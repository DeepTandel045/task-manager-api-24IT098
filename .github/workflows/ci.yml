name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Automated Tests
        run: |
          npx jest --forceExit || {
            ERR=$(npx jest --forceExit 2>&1 | tr '\n' ' ' | head -c 1000)
            echo "::error title=TestFailure::$ERR"
            exit 1
          }
